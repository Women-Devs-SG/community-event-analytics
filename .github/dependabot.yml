version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    # Keep TypeScript on the supported 6.0 line; compiler migrations are manual.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # lint-staged 17 requires Node >=22.22.1, above this project's `>=22` engine range.
      # Upgrade manually together with raising `engines.node`.
      - dependency-name: lint-staged
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
