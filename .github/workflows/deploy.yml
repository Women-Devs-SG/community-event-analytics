name: Deploy dashboards to GitHub Pages

on:
  push:
    branches: [main]
  # The dashboard shows data as of the last build, so rebuild daily to pick up
  # new rows. Run it manually from the Actions tab for an immediate refresh.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      VITE_DATA_SOURCE: ${{ vars.VITE_DATA_SOURCE }}
      VITE_REPORTING_TIMEZONE: ${{ vars.VITE_REPORTING_TIMEZONE }}
      VITE_SOURCE_LABEL: ${{ vars.VITE_SOURCE_LABEL }}
      # google-signin mode only. Both are public by design: neither grants access.
      VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.VITE_GOOGLE_OAUTH_CLIENT_ID }}
      VITE_APPS_SCRIPT_URL: ${{ vars.VITE_APPS_SCRIPT_URL }}
      # Build-only: used by `npm run summary` to read the sheet. None of these
      # reach the published site. VITE_-prefixed names are accepted for older setups.
      GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID || vars.VITE_GOOGLE_SHEET_ID }}
      GOOGLE_TAB_EVENTS: ${{ vars.GOOGLE_TAB_EVENTS || vars.VITE_GOOGLE_TAB_EVENTS }}
      GOOGLE_TAB_SURVEY_RESPONSES: ${{ vars.GOOGLE_TAB_SURVEY_RESPONSES || vars.VITE_GOOGLE_TAB_SURVEY_RESPONSES }}
      GOOGLE_TAB_FEEDBACK_ANSWERS: ${{ vars.GOOGLE_TAB_FEEDBACK_ANSWERS || vars.VITE_GOOGLE_TAB_FEEDBACK_ANSWERS }}
      GOOGLE_TAB_REGISTRATIONS: ${{ vars.GOOGLE_TAB_REGISTRATIONS || vars.VITE_GOOGLE_TAB_REGISTRATIONS }}
      GOOGLE_TAB_PARTICIPANTS: ${{ vars.GOOGLE_TAB_PARTICIPANTS || vars.VITE_GOOGLE_TAB_PARTICIPANTS }}
      GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
      VITE_COMMUNITY_NAME: ${{ vars.VITE_COMMUNITY_NAME }}
      VITE_COMMUNITY_SHORT_NAME: ${{ vars.VITE_COMMUNITY_SHORT_NAME }}
      VITE_COMMUNITY_LOCATION: ${{ vars.VITE_COMMUNITY_LOCATION }}
      VITE_DASHBOARD_TITLE: ${{ vars.VITE_DASHBOARD_TITLE }}
      VITE_DASHBOARD_SUBTITLE: ${{ vars.VITE_DASHBOARD_SUBTITLE }}
      VITE_DASHBOARD_FOOTER: ${{ vars.VITE_DASHBOARD_FOOTER }}
      VITE_COLOR_PRIMARY: ${{ vars.VITE_COLOR_PRIMARY }}
      VITE_COLOR_SECONDARY: ${{ vars.VITE_COLOR_SECONDARY }}
      VITE_COLOR_ACCENT: ${{ vars.VITE_COLOR_ACCENT }}
      VITE_COLOR_SURFACE: ${{ vars.VITE_COLOR_SURFACE }}
      VITE_COLOR_CARD: ${{ vars.VITE_COLOR_CARD }}
      VITE_COLOR_INK: ${{ vars.VITE_COLOR_INK }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run scan:generic
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
